<div class="inbox-container radiant-ui-theme">
  <header class="inbox-header">
    <h1>Unified Inbox</h1>
    <p>Omnisense AI: Enabled</p>
  </header>

  <section class="ticket-list">
    <p *ngIf="loading" class="loading-message">Loading tickets...</p>
    <p *ngIf="error" class="error-message">{{ error }}</p>

    <div *ngFor="let ticket of activeTickets" 
         class="ticket-card" 
         [ngClass]="ticket.channel.toLowerCase()">
      <div class="ticket-info">
        <span class="channel-badge">{{ ticket.channel }}</span>
        <h3>{{ ticket.customerName }}</h3>
        <p>{{ ticket.lastMessage }}</p>
      </div>
      <div class="ai-summary" *ngIf="ticket.omnisenseSummary">
        <strong>Omnisense Insight:</strong> {{ ticket.omnisenseSummary }}
      </div>
      <div class="actions">
        <button (click)="openTicket(ticket.id)" class="radiant-btn-primary">Responder</button>
      </div>
    </div>

    <p *ngIf="!loading && !error && activeTickets.length === 0" class="empty-message">No tickets found.</p>
  </section>
</div>
